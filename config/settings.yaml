# ============================================================
# GRID BOT CONFIGURATION
# Change behavior here, not in Python code.
# ============================================================

# --- Trading pairs ---
# We ONLY trade these two. No others.
trading:
  pairs:
    - symbol: BTCUSDT
      base: BTC
      quote: USDT
    - symbol: ETHUSDT
      base: ETH
      quote: USDT

# --- Grid parameters ---
# These control the grid's shape and behavior
grid:
  # Number of grid levels above AND below current price
  # Total orders = levels_above + levels_below
  levels_above: 2
  levels_below: 2

  # Base spacing as percentage of current price
  # 0.3% of $60,000 = $180 spacing
  # This is the DEFAULT — signals will adjust it dynamically
  base_spacing_pct: 0.3

  # Min/max spacing bounds (safety rails)
  min_spacing_pct: 0.15    # Never tighter than this (fees would eat profit)
  max_spacing_pct: 1.0     # Never wider than this (too few cycles)

  # Order size per grid level (in base asset)
  order_size:
    BTCUSDT: 0.0003          # canary: ~$22 at $75k (was 0.001)
    ETHUSDT: 0.005           # canary: ~$12 at $2.4k (was 0.01)

  # Re-centering: when price moves this far from grid center,
  # cancel and rebuild the grid around new price
  recenter_threshold_pct: 2.0

# --- Risk management ---
risk:
  # Maximum percentage of portfolio in open positions
  max_exposure_pct: 30.0

  # Per-trade stop loss (percentage from entry)
  stop_loss_pct: 1.5

  # Portfolio drawdown tiers
  drawdown:
    soft_limit_pct: 3.0     # Reduce order sizes by 50%
    hard_limit_pct: 5.0     # Pause grid, no new orders
    kill_pct: 8.0            # Cancel ALL orders, flatten position

  # Maximum number of open orders across all pairs
  max_open_orders: 20

  # Daily loss limit (USD) — kill-switch triggers if breached
  daily_loss_limit_usd: 500.0

# --- Mainnet risk overrides (Phase 10) ---
# When env_mode == mainnet, THESE values shadow the corresponding keys in
# the `risk:` block above. Testnet ignores this block entirely. The idea:
# keep testnet permissive enough to exercise every code path, then dial
# real money down until a canary proves stability.
risk_overrides:
  mainnet:
    # Half of testnet — keep the open-order footprint small while we prove
    # the mainnet path. 2 symbols × ~5 levels/side would hit 20; we cap
    # to 10 so a runaway loop is bounded to roughly "one grid worth".
    max_open_orders: 10
    # Real money floor, in USD. $20 for the first canary day — roughly
    # 13% of a $150 wallet. If rolling 24h realized PnL dips below -$20
    # the kill switch trips and we stop. Raise to $50 once stability is
    # proven over a few days.
    daily_loss_limit_usd: 20.0

# --- Signal weights ---
# How much each signal influences grid decisions
# Must sum to 1.0
signals:
  supply_demand_weight: 0.50   # Strongest — defines grid bounds
  liquidity_weight: 0.30       # Second — adjusts spacing
  sentiment_weight: 0.20       # Third — safety override

  # Sentiment score below this pauses the grid entirely
  sentiment_pause_threshold: -0.7

  # Sentiment signal config (Phase 8) — pauses initial + recenter
  # placement on strongly-negative news/social sentiment. Replacement
  # orders are NOT gated (existing inventory needs an exit).
  # v1 source is a JSON file the operator updates via
  # `python -m scripts.set_sentiment -- -0.85 "reason"`.
  sentiment:
    # Path to the JSON sentinel. Same convention as runtime/HALT.
    sentiment_path: runtime/SENTIMENT
    # Treat readings older than this as stale → revert to neutral.
    # 1800s = 30 min; old news is no news. Set to 0 to disable.
    max_age_seconds: 1800.0

  # Liquidity signal config (Phase 7) — adapts grid spacing to spread,
  # pauses placement when the market looks broken (wide spread).
  liquidity:
    # Pause placement if spread exceeds this (bps). 50 bps = 0.5%.
    # Binance BTCUSDT normally sits at 1-5 bps; testnet can be wider.
    pause_spread_bps: 50.0
    # Grid spacing must be >= this multiple of spread. 4× clears a
    # 2× spread cost plus 2× fees (0.1% each) with some margin.
    min_spacing_to_spread_ratio: 4.0
    # How many book levels to sum for depth imbalance. Matches the
    # engine's default get_order_book depth.
    depth_levels: 20

  # Supply & Demand detector config (Phase 4)
  supply_demand:
    # --- Footprint imbalance (trade-flow based) ---
    footprint:
      window_minutes: 15          # Analyse the last 15 min of trades
      # $ width of each price bucket — calibrated for BTC ~$75k, ETH ~$2.3k
      bucket_size:
        BTCUSDT: 50.0             # 50 USDT buckets ≈ 6-7 bps of BTC
        ETHUSDT: 1.0              # 1 USDT buckets ≈ 4 bps of ETH
      # Minimum total volume (base asset) in a bucket to consider it
      min_volume:
        BTCUSDT: 0.5              # ≥ 0.5 BTC traded in the bucket
        ETHUSDT: 5.0              # ≥ 5 ETH traded in the bucket
      # |imbalance| threshold — 0.6 means one side is ≥80% of volume
      imbalance_threshold: 0.6

    # --- Absorption walls (order-book persistence based) ---
    absorption:
      window_minutes: 5           # Look over last 5 min of snapshots
      min_persistence_ratio: 0.7  # Level must appear in ≥70% of snapshots
      max_size_decay_pct: 0.30    # Size may shrink ≤30% across window
      size_zscore_threshold: 2.0  # Level must be ≥2σ above mean depth
      # ± $ padding around the exact wall price to form the zone band
      zone_pad:
        BTCUSDT: 5.0
        ETHUSDT: 0.5

# --- Exchange settings ---
exchange:
  name: binance
  use_testnet: true            # START WITH TESTNET. Always.

  # Rate limiting (Binance allows 1200 req/min)
  max_requests_per_minute: 1000  # Stay under the limit
  order_timeout_seconds: 5       # Cancel if not acknowledged in 5s

  # Reconnection policy for WebSocket
  ws_reconnect_delay_seconds: 1
  ws_max_reconnect_attempts: 10

# --- Observability (Phase 10B) ---
# Periodic health signal + structured snapshot for external watchers. See
# src/observability/heartbeat.py for semantics.
observability:
  # How often to emit a heartbeat log line and rewrite STATUS.json.
  # 300s = every 5 minutes. Drop to 60s for canary runs where you want
  # faster feedback; keep at 300s in steady state so logs stay readable.
  heartbeat_interval_s: 300
  # Atomic snapshot file — same runtime/ directory as HALT + SENTIMENT.
  # External dashboards / cron watchers read this without attaching to
  # the Python process.
  status_path: runtime/STATUS.json
  # Log a DAILY SUMMARY line on UTC day rollover (diff of counters over
  # the day just ended). Set to false only for noisy debugging.
  enable_daily_summary: true

# --- Notifications (Phase 11A) ---
# Telegram alerts + remote /halt control. Disabled by default — flip
# `enabled: true` AFTER you have set TELEGRAM_BOT_TOKEN and
# TELEGRAM_ALLOWED_CHAT_IDS in .env. The factory always returns a working
# alerter (NullAlerter when disabled), so a missing or broken telegram
# config never prevents the bot from booting.
telegram:
  # Master switch. false → NullAlerter, no network code runs.
  enabled: false
  # Per-call HTTP timeout for sendMessage. 5s is plenty for Telegram's API
  # in normal conditions; the sender retries on timeout anyway.
  send_timeout_seconds: 5
  # Bounded outbound queue. On overflow we drop OLDEST and prefix the next
  # successful send with "(N alerts dropped due to queue overflow)" so the
  # operator knows they missed something. 100 covers a multi-hour outage
  # of typical alert volume.
  max_queue_size: 100
  # Per-event toggles. Mirrors the design doc Section 3 taxonomy.
  # Heartbeat alerts are 288/day — too noisy for a phone, and STATUS.json
  # already covers liveness. Recenter alerts are routine; visible in logs.
  alert_on:
    boot: true
    shutdown: true
    crash: true
    fill: true
    halt: true
    pause: true
    resume: true
    heartbeat: false
    daily_summary: true
    recenter: false

# --- Logging ---
logging:
  level: INFO                   # DEBUG in dev, INFO in prod
  format: json                  # Structured logs for production
  file: logs/grid_bot.log
